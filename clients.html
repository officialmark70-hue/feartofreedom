<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Cleaning Clients</title>
<style>
  :root {
    --surface-0: #f9f9f7;
    --surface-1: #fcfcfb;
    --surface-2: #f1f0ec;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;

    --status-good: #0ca30c;
    --status-good-bg: rgba(12,163,12,0.10);

    --series-blue: #2a78d6;
    --series-aqua: #1baf7a;
    --series-yellow: #eda100;
    --series-green: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #0d0d0d;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;

      --status-good: #0ca30c;
      --status-good-bg: rgba(12,163,12,0.16);

      --series-blue: #3987e5;
      --series-aqua: #199e70;
      --series-yellow: #c98500;
      --series-green: #008300;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    line-height: 1.5;
    padding: 32px 20px 64px;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .subhead {
    color: var(--text-secondary);
    margin-top: 6px;
    font-size: 0.95rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin: 28px 0;
  }

  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .stat-tile .label {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stat-tile .value {
    font-size: 1.7rem;
    font-weight: 700;
    margin-top: 4px;
    font-variant-numeric: proportional-nums;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }

  .controls input[type="search"] {
    flex: 1 1 220px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 0.92rem;
  }

  .controls select {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 0.92rem;
  }

  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .seg button {
    border: none;
    background: var(--surface-1);
    color: var(--text-secondary);
    padding: 9px 14px;
    font-size: 0.88rem;
    cursor: pointer;
    border-right: 1px solid var(--border);
  }

  .seg button:last-child { border-right: none; }

  .seg button.active {
    background: var(--text-primary);
    color: var(--surface-0);
    font-weight: 600;
  }

  .count-note {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--gridline);
    font-size: 0.88rem;
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: var(--surface-2); }

  .client-name { font-weight: 600; }
  .muted { color: var(--text-muted); }

  a { color: inherit; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-active { background: var(--status-good-bg); color: var(--status-good); }
  .badge-inactive { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .provider {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-bsl { background: var(--series-blue); }
  .dot-betterliving { background: var(--series-aqua); }
  .dot-likeourown { background: var(--series-yellow); }
  .dot-private { background: var(--series-green); }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
  }

  @media (max-width: 900px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tbody tr {
      border-bottom: 1px solid var(--gridline);
      padding: 14px;
    }
    tbody td {
      border: none;
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    tbody td::before {
      content: attr(data-label);
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Private Cleaning Clients</h1>
  <p class="subhead">Client roster and visit history</p>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Search name or address…">
    <div class="seg" id="statusSeg">
      <button data-status="all" class="active">All</button>
      <button data-status="Active">Active</button>
      <button data-status="Inactive">Inactive</button>
    </div>
    <select id="providerFilter">
      <option value="all">All providers</option>
    </select>
  </div>

  <p class="count-note" id="countNote"></p>

  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>Address</th>
        <th>Contact</th>
        <th>Provider</th>
        <th>Repeat</th>
        <th>Hours</th>
        <th>First Visit</th>
        <th>Last Visit</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">No clients match these filters.</div>
</div>

<script>
  const clients = [
    { name: "Judith Mills (Judy)", address: "2B Margaret Street, Langwarrin", phone: "9789 1072 / 0434 545 420 (text)", email: null, provider: "BSL", providerGroup: "BSL", repeat: "Fortnightly", hours: "2 hours", firstVisit: "14 April 2026", firstVisitSort: "2026-04-14", lastVisit: null, status: "Active" },
    { name: "Terence (Terry) Jones", address: "1A Margaret Street, Langwarrin", phone: "Karen (partner): 0434 264 154", email: null, provider: "BSL", providerGroup: "BSL", repeat: "Fortnightly", hours: "2 hours", firstVisit: "23 June 2026", firstVisitSort: "2026-06-23", lastVisit: null, status: "Active" },
    { name: "Jane Coward", address: "14 Elm Grove, Langwarrin", phone: "+61 417 323 653", email: null, provider: "Better Living (CP: Natalia)", providerGroup: "Better Living", repeat: "Fortnightly", hours: "2 hours", firstVisit: "2 June 2026", firstVisitSort: "2026-06-02", lastVisit: null, status: "Active" },
    { name: "Debra Martin", address: "2 Thomas Street, Baxter", phone: "0402 421 119", email: null, provider: "Like Our Own", providerGroup: "Like Our Own", repeat: "Fortnightly", hours: "1.5 hours", firstVisit: "4 May 2026", firstVisitSort: "2026-05-04", lastVisit: null, status: "Active" },
    { name: "Cheri Jackson", address: "14 Yamala Dr., Frankston South", phone: "+61 412 701 501", email: null, provider: "Private", providerGroup: "Private", repeat: "Fortnightly", hours: "4 hours", firstVisit: "1 May 2026", firstVisitSort: "2026-05-01", lastVisit: null, status: "Active" },
    { name: "Irene Calvert", address: "76 Woolston Drv, Frankston South", phone: "+61 400 283 976", email: "irene716221@gmail.com", provider: "Private", providerGroup: "Private", repeat: "Fortnightly", hours: "2 hours", firstVisit: "8 May 2026", firstVisitSort: "2026-05-08", lastVisit: null, status: "Active" },
    { name: "Beverley Smith", address: "1/59 Station Street, Somerville", phone: "03 5979 1262", email: null, provider: "Like Our Own", providerGroup: "Like Our Own", repeat: "Fortnightly", hours: null, firstVisit: "4 May 2026", firstVisitSort: "2026-05-04", lastVisit: null, status: "Active" },
    { name: "Robyn", address: "31 Hooper Grove, Mount Martha", phone: "0403 581 083", email: null, provider: "Private", providerGroup: "Private", repeat: null, hours: null, firstVisit: "21 April 2026", firstVisitSort: "2026-04-21", lastVisit: "21 April 2026", status: "Inactive" },
    { name: "Apu", address: "37 Lillypilly St, Warragul", phone: "+61 426 796 605", email: "apanuj21@gmail.com", provider: "Private", providerGroup: "Private", repeat: "One-off", hours: null, firstVisit: "24 April 2026", firstVisitSort: "2026-04-24", lastVisit: "24 April 2026", status: "Inactive" },
  ];

  const dotClass = { "BSL": "dot-bsl", "Better Living": "dot-betterliving", "Like Our Own": "dot-likeourown", "Private": "dot-private" };

  const state = { status: "all", provider: "all", search: "" };

  const providerFilter = document.getElementById("providerFilter");
  [...new Set(clients.map(c => c.providerGroup))].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    providerFilter.appendChild(opt);
  });

  function contactHtml(c) {
    const parts = [];
    if (c.phone) {
      const telMatch = c.phone.match(/(\+?\d[\d\s]{6,}\d)/);
      if (telMatch && !c.phone.includes("partner") && !c.phone.includes("text")) {
        parts.push(`<a href="tel:${telMatch[1].replace(/\s/g, '')}">${c.phone}</a>`);
      } else {
        parts.push(c.phone);
      }
    }
    if (c.email) parts.push(`<a href="mailto:${c.email}">${c.email}</a>`);
    if (!parts.length) return '<span class="muted">—</span>';
    return parts.join('<br>');
  }

  function render() {
    const q = state.search.trim().toLowerCase();
    const filtered = clients.filter(c => {
      if (state.status !== "all" && c.status !== state.status) return false;
      if (state.provider !== "all" && c.providerGroup !== state.provider) return false;
      if (q && !(c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q))) return false;
      return true;
    });

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = filtered.map(c => `
      <tr>
        <td data-label="Client" class="client-name">${c.name}</td>
        <td data-label="Address">${c.address}</td>
        <td data-label="Contact">${contactHtml(c)}</td>
        <td data-label="Provider">
          <span class="provider"><span class="dot ${dotClass[c.providerGroup] || ''}"></span>${c.provider}</span>
        </td>
        <td data-label="Repeat">${c.repeat || '<span class="muted">—</span>'}</td>
        <td data-label="Hours">${c.hours || '<span class="muted">—</span>'}</td>
        <td data-label="First Visit">${c.firstVisit}</td>
        <td data-label="Last Visit">${c.lastVisit || '<span class="muted">—</span>'}</td>
        <td data-label="Status">
          <span class="badge ${c.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${c.status}</span>
        </td>
      </tr>
    `).join("");

    document.getElementById("emptyState").style.display = filtered.length ? "none" : "block";
    document.querySelector("table").style.display = filtered.length ? "table" : "none";
    document.getElementById("countNote").textContent =
      `Showing ${filtered.length} of ${clients.length} client${clients.length === 1 ? '' : 's'}`;
  }

  function renderStats() {
    const total = clients.length;
    const active = clients.filter(c => c.status === "Active").length;
    const inactive = total - active;
    const providers = new Set(clients.map(c => c.providerGroup)).size;
    const fortnightlyHours = clients
      .filter(c => c.status === "Active" && c.repeat === "Fortnightly" && c.hours)
      .reduce((sum, c) => sum + parseFloat(c.hours), 0);

    const stats = [
      { label: "Total Clients", value: total },
      { label: "Active", value: active },
      { label: "Inactive", value: inactive },
      { label: "Providers", value: providers },
      { label: "Fortnightly Hours Booked", value: `${fortnightlyHours}h` },
    ];

    document.getElementById("stats").innerHTML = stats.map(s => `
      <div class="stat-tile">
        <div class="label">${s.label}</div>
        <div class="value">${s.value}</div>
      </div>
    `).join("");
  }

  document.getElementById("search").addEventListener("input", e => {
    state.search = e.target.value;
    render();
  });

  document.getElementById("statusSeg").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    state.status = btn.dataset.status;
    document.querySelectorAll("#statusSeg button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });

  providerFilter.addEventListener("change", e => {
    state.provider = e.target.value;
    render();
  });

  renderStats();
  render();
</script>
</body>
</html>
